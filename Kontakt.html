                    <div class="kforma">
                    <label for="name">Ime i Prezime:</label> <br>
                    <input type="text" id="name" name="name" placeholder="Ime i Prezime" required>

                    <input type="email" id="email" name="email" placeholder="Email" required>
                    </div> 
                    
                    <div class="kforma">
                    <label for="message">Poruka:</label> <br>
                    <textarea id="message" name="message" placeholder="Vaša poruka" rows="5" required></textarea>
